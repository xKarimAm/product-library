name: Feature request
description: Suggest something Product Library should show or check
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not the solution. Product Library stays read-only and
        standard-library only; anything that needs to write belongs in a skill.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you see or check today, and when does it bite?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What you'd like to see
      description: The outcome in the city, a page or the API. Sketches welcome.
    validations:
      required: true

  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: This works without writing to project folders or `~/.claude`.
        - label: This needs no new dependency.
